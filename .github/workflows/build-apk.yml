name: Build APK (stable debug)

on:
  workflow_dispatch:
  push:
    branches: [ci-build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build stable debug APK
        run: ./gradlew assembleStstableDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-stable-debug-apk
          path: smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
